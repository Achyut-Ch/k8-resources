apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx
  # these labels are replica set labels
  labels:
    project: roboshop
    purpose: rs-demo
    tier: frontend
    component: frontend
spec:
  replicas: 3 
  selector:
  # using these labels replicaset selects the pods
    matchLabels:
      project: roboshop
      purpose: rs-demo
      tier: frontend
      component: frontend
  # this is pod definition , pod is subset of replica set
  template:
    metadata:
      labels:
        project: roboshop
        purpose: rs-demo
        tier: frontend
        component: frontend
    spec:
      containers:
      - name: nginx
        image: nginx
